const f=document.getElementById('f'), L=['أ','ب','ج','د'];
qs.forEach((q,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<b>'+(i+1)+'. '+q[0]+'</b>';q[1].forEach((x,j)=>d.innerHTML+='<label class="o"><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+') '+x+'</label>');f.appendChild(d)});
function go(){const n=document.getElementById('name').value.trim();if(!n){alert('اكتب اسم المختبر أولاً');return}let s=0,w=[];qs.forEach((q,i)=>{let x=document.querySelector('input[name=q'+i+']:checked');if(x&&+x.value===q[2])s++;else w.push(i+1)});let p=(s/30*100).toFixed(1),r=document.getElementById('res');r.style.display='block';r.innerHTML='<h2>'+n+'</h2><h3>النتيجة: '+s+'/30 — '+p+'%</h3>'+(w.length?'<p>أسئلة تحتاج مراجعة: '+w.join('، ')+'</p>':'<p>🎉 جميع الإجابات صحيحة.</p>')+'<button onclick="share()">إرسال النتيجة عبر واتساب</button>';window.scrollTo(0,document.body.scrollHeight)}
